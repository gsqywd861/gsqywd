name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-watermark-remover/package-lock.json

      - name: Install dependencies
        working-directory: media-watermark-remover
        run: npm ci

      - name: Build project
        working-directory: media-watermark-remover
        run: npm run build

      - name: Remove large WASM files (loaded from CDN)
        working-directory: media-watermark-remover
        run: find dist -name "*.wasm" -delete

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f7b557e9d4336308f80599c462c783a3
        run: npx wrangler@latest pages deploy media-watermark-remover/dist --project-name=gsqywd --branch=main --commit-message="${{ github.event.head_commit.message }}"
